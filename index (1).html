<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>정치 뉴스 스펙트럼 분석기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1a4fa0;
    --blue-light: #e8eef8;
    --red: #b91c1c;
    --red-light: #fce8e8;
    --neutral: #4b5563;
    --neutral-light: #f3f4f6;
    --bg: #fafaf8;
    --card: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --text-muted: #6b7280;
    --accent: #1a4fa0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--text);
    color: white;
    padding: 2rem;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent,
      transparent 40px,
      rgba(255,255,255,0.03) 40px,
      rgba(255,255,255,0.03) 41px
    );
  }

  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    position: relative;
  }

  .header-tag {
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 8px;
  }

  header h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }

  header p {
    font-size: 13px;
    color: rgba(255,255,255,0.6);
    line-height: 1.6;
  }

  .spectrum-legend {
    display: flex;
    gap: 20px;
    margin-top: 16px;
    font-size: 12px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem;
  }

  .input-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 2rem;
  }

  .input-section h2 {
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--text);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  textarea {
    width: 100%;
    height: 140px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    line-height: 1.7;
    resize: vertical;
    color: var(--text);
    background: var(--bg);
    transition: border-color 0.2s;
  }

  textarea:focus {
    outline: none;
    border-color: var(--blue);
  }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 12px;
  }

  button {
    padding: 10px 20px;
    border-radius: 8px;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
    border: none;
  }

  .btn-primary {
    background: var(--text);
    color: white;
  }

  .btn-primary:hover { background: #374151; }
  .btn-primary:disabled { background: #9ca3af; cursor: not-allowed; }

  .btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
  }

  .btn-secondary:hover { background: var(--neutral-light); }

  .loading {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 1rem;
    color: var(--text-muted);
    font-size: 13px;
  }

  .loading.active { display: flex; }

  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--blue);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .articles-grid {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .article-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: box-shadow 0.2s;
  }

  .article-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.06); }

  .card-header {
    padding: 1rem 1.25rem 0.75rem;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
  }

  .card-title {
    font-family: 'Noto Serif KR', serif;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.5;
    color: var(--text);
    flex: 1;
  }

  .stance-badge {
    flex-shrink: 0;
    padding: 4px 10px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
  }

  .stance-진보 { background: var(--blue-light); color: var(--blue); }
  .stance-보수 { background: var(--red-light); color: var(--red); }
  .stance-중립 { background: var(--neutral-light); color: var(--neutral); }

  .spectrum-bar-wrap {
    padding: 0 1.25rem 0.75rem;
  }

  .spectrum-label-row {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 5px;
    letter-spacing: 0.05em;
  }

  .spectrum-track {
    height: 8px;
    background: linear-gradient(to right, var(--blue-light), #f0f0f0, var(--red-light));
    border-radius: 99px;
    position: relative;
    border: 1px solid var(--border);
  }

  .spectrum-pin {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    transition: left 0.6s ease;
  }

  .card-body {
    padding: 0 1.25rem 1rem;
    border-top: 1px solid var(--border);
    margin-top: 4px;
  }

  .summary-block {
    padding-top: 0.75rem;
  }

  .summary-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 4px;
  }

  .summary-text {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
  }

  .positions-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }

  .position-box {
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 12px;
    line-height: 1.6;
  }

  .position-box.blue {
    background: var(--blue-light);
    color: #1e3a6e;
  }

  .position-box.red {
    background: var(--red-light);
    color: #7f1d1d;
  }

  .position-box-label {
    font-weight: 700;
    font-size: 11px;
    margin-bottom: 4px;
    letter-spacing: 0.05em;
  }

  .empty-state {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-muted);
  }

  .empty-state .icon {
    font-size: 40px;
    margin-bottom: 12px;
    opacity: 0.3;
  }

  .empty-state p {
    font-size: 14px;
    line-height: 1.6;
  }

  .sample-btn {
    display: inline-block;
    margin-top: 12px;
    padding: 8px 16px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
  }

  .sample-btn:hover { background: var(--neutral-light); }

  .error-msg {
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: #991b1b;
    margin-top: 12px;
    display: none;
  }

  .error-msg.active { display: block; }

  footer {
    text-align: center;
    padding: 2rem;
    font-size: 11px;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    margin-top: 3rem;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-tag">Political News Spectrum Analyzer</div>
    <h1>정치 뉴스 스펙트럼 분석기</h1>
    <p>기사를 입력하면 AI가 진보·보수 시각 차이를 분석하고 스펙트럼으로 시각화합니다</p>
    <div class="spectrum-legend">
      <div class="legend-item">
        <div class="legend-dot" style="background:#1a4fa0"></div>
        <span style="color:rgba(255,255,255,0.6)">진보</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#9ca3af"></div>
        <span style="color:rgba(255,255,255,0.6)">중립</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot" style="background:#b91c1c"></div>
        <span style="color:rgba(255,255,255,0.6)">보수</span>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="input-section">
    <h2>기사 입력</h2>
    <textarea id="articleInput" placeholder="분석할 정치 기사를 여기에 붙여넣기 하세요..."></textarea>
    <div class="btn-row">
      <button class="btn-primary" onclick="analyzeArticle()" id="analyzeBtn">분석하기</button>
      <button class="btn-secondary" onclick="loadSample()">샘플 기사 불러오기</button>
      <button class="btn-secondary" onclick="clearAll()">전체 초기화</button>
    </div>
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <span>AI가 기사를 분석하는 중입니다...</span>
    </div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="articles-grid" id="articlesGrid">
    <div class="empty-state">
      <div class="icon">📰</div>
      <p>기사를 입력하고 분석하기 버튼을 눌러주세요.<br>진보·보수 스펙트럼과 핵심 쟁점이 시각화됩니다.</p>
      <button class="sample-btn" onclick="loadSample()">샘플 기사로 먼저 체험해보기</button>
    </div>
  </div>
</main>

<footer>
  Made with Claude API · 정치부 인턴 경험 기반 프로젝트
</footer>

<script>
const SAMPLE_ARTICLE = `더불어민주당이 17일 한·미 양국 관세협상 조인트 팩트시트 발표에 대해 "국익 중심 실용외교로 낸 큰 성과"라며 "이번 성과는 정부와 기업이 원팀으로 뛰며 만들어낸 결과"라고 했다. 정청래 민주당 대표는 이날 국회 본청에서 열린 최고위원회의에서 "대기업 총수들이 대통령에게 공개적으로 감사 표현을 한 경우에 대한 기억이 잘 없다. 그만큼 이번 APEC과 한미 관세 협상이 매우 성공적이었다"고 했다. 김병기 원내대표도 "러트닉 미 상무장관도 '기업과 정부가 함께 뛰는 팀은 한국밖에 없었다'고 높이 평가했다"며 "기업인 여러분께 다시 한 번 감사드린다"고 했다. 반면 국민의힘 장동혁 대표는 팩트시트에 대해 '알맹이 없다'며 비판했고, 팩트시트가 국회 비준 대상이 되어야 한다는 주장을 폈다.`;

let articles = [];

function loadSample() {
  document.getElementById('articleInput').value = SAMPLE_ARTICLE;
}

function clearAll() {
  document.getElementById('articleInput').value = '';
  articles = [];
  renderArticles();
}

async function analyzeArticle() {
  const text = document.getElementById('articleInput').value.trim();
  if (!text) return;

  const btn = document.getElementById('analyzeBtn');
  const loading = document.getElementById('loading');
  const errorMsg = document.getElementById('errorMsg');

  btn.disabled = true;
  loading.classList.add('active');
  errorMsg.classList.remove('active');

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `당신은 한국 정치 뉴스를 분석하는 전문가입니다. 기사를 분석하고 반드시 아래 JSON 형식만 반환하세요. 다른 텍스트나 마크다운은 절대 포함하지 마세요.

{
  "title": "기사 핵심 제목 (20자 이내)",
  "stance": "진보 또는 보수 또는 중립",
  "score": 진보=0~40, 중립=41~59, 보수=60~100 사이 숫자,
  "summary": "기사 핵심 요약 2문장",
  "progressive_view": "진보 측 입장 1~2문장",
  "conservative_view": "보수 측 입장 1~2문장",
  "key_issue": "핵심 쟁점 키워드 (10자 이내)"
}`,
        messages: [{ role: 'user', content: `다음 기사를 분석해주세요:\n\n${text}` }]
      })
    });

    const data = await response.json();
    const raw = data.content.map(i => i.text || '').join('');
    const clean = raw.replace(/```json|```/g, '').trim();
    const result = JSON.parse(clean);

    articles.unshift({ ...result, id: Date.now(), original: text });
    document.getElementById('articleInput').value = '';
    renderArticles();

  } catch (err) {
    errorMsg.textContent = '분석 중 오류가 발생했습니다. 다시 시도해주세요.';
    errorMsg.classList.add('active');
  } finally {
    btn.disabled = false;
    loading.classList.remove('active');
  }
}

function renderArticles() {
  const grid = document.getElementById('articlesGrid');

  if (articles.length === 0) {
    grid.innerHTML = `
      <div class="empty-state">
        <div class="icon">📰</div>
        <p>기사를 입력하고 분석하기 버튼을 눌러주세요.<br>진보·보수 스펙트럼과 핵심 쟁점이 시각화됩니다.</p>
        <button class="sample-btn" onclick="loadSample()">샘플 기사로 먼저 체험해보기</button>
      </div>`;
    return;
  }

  grid.innerHTML = articles.map(a => {
    const pinColor = a.stance === '진보' ? '#1a4fa0' : a.stance === '보수' ? '#b91c1c' : '#9ca3af';
    const pinLeft = Math.max(5, Math.min(95, a.score));

    return `
    <div class="article-card">
      <div class="card-header">
        <div class="card-title">${a.title}</div>
        <span class="stance-badge stance-${a.stance}">${a.stance} · ${a.key_issue}</span>
      </div>
      <div class="spectrum-bar-wrap">
        <div class="spectrum-label-row">
          <span>← 진보</span>
          <span>중립</span>
          <span>보수 →</span>
        </div>
        <div class="spectrum-track">
          <div class="spectrum-pin" style="left:${pinLeft}%; background:${pinColor};"></div>
        </div>
      </div>
      <div class="card-body">
        <div class="summary-block">
          <div class="summary-label">AI 요약</div>
          <div class="summary-text">${a.summary}</div>
        </div>
        <div class="positions-row">
          <div class="position-box blue">
            <div class="position-box-label">진보 시각</div>
            ${a.progressive_view}
          </div>
          <div class="position-box red">
            <div class="position-box-label">보수 시각</div>
            ${a.conservative_view}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}
</script>
</body>
</html>
